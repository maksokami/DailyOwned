# ============================================================
#  Security News Intelligence System — Configuration
# ============================================================

# --- Ollama Settings ---
ollama:
  base_url: "http://localhost:11434"
  # Model used for generating embeddings (must be an embedding model)
  embedding_model: "qllama/bge-m3:q8_0"
  # Model used for cluster summaries, topic labels, and blindspot analysis
  completion_model: "deepseek-r1:8b"
  # Timeout in seconds for LLM calls
  timeout: 120

# --- Relevance Filter ---
# Articles with cosine similarity below this threshold vs. your liked pool are dropped.
# Range: 0.0 – 1.0. Lower = more permissive. Start at 0.45 and raise if too noisy.
relevance_threshold: 0.45

# --- Clustering ---
# DBSCAN eps: controls how tight clusters must be (cosine distance, 0–1 range on normalized vectors).
# Lower eps = tighter, more specific clusters. Raise if too many singletons.
cluster_eps: 0.85
# Minimum articles to form a cluster (singletons below this are "noise" → blindspot candidates)
cluster_min_samples: 2

# --- Top Cited ---
# Number of topic clusters to feature in "Top Cited" section
top_cited_count: 5

# --- Top Blindspots ---
# Minimum relevance score to qualify as a blindspot
blindspot_min_score: 0.65
# Number of blindspot articles to feature
blindspot_count: 5

# --- Schedule ---
# Cron expression for the daily digest. Default: 7:00 AM
schedule:
  cron: "0 7 * * *"
  timezone: "America/Chicago"

# --- Paths ---
paths:
  # Path to your local clone of the GitHub Pages repository
  github_pages_repo: "/home/youruser/pathto/DailyOwned"
  # Where the rendered HTML is written before publishing
  output_html: "./output/index.html"
  # Your liked articles seed file
  liked_articles: "./liked_articles.txt"
  disliked_articles: "./disliked_articles.txt"
  # Cached memory profile (auto-generated, do not edit manually)
  memory_profile: "./memory/profile.json"
  # Feed definitions
  feeds: "./feeds.yaml"

# --- Publishing ---
publish:
  # Set to false for --dry-run mode (no git push)
  enabled: true
  commit_message: "Auto: daily security digest {date}"
  # Branch to push to
  branch: "main"

# --- HTML Output ---
html:
  # Site title shown in browser tab and header
  title: "Daily Owned"
  # Tagline shown under the title
  tagline: "Daily curated cybersecurity news"
  # How many hours back to look for articles (24 = last day, 168 = last week)
  # Using 72h by default so weekly-publishing feeds also contribute.
  # Lower to 24 once you confirm steady article flow.
  lookback_hours: 72
  # Max articles to show in the general feed (below Top Cited / Blindspots)
  max_feed_articles: 40
